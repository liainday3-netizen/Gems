openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gem Ledger API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: consumer
    description: Consumer-facing endpoints (require x-api-key)
  - name: users
    description: User management
  - name: wallets
    description: Wallet balances
  - name: transactions
    description: Gem transactions
  - name: treasury
    description: Treasury backing and gem conversion
  - name: api-keys
    description: API key management
paths:
  /balance:
    get:
      operationId: getBalance
      tags: [consumer]
      summary: Get balance by username (auto-creates user on first call)
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balance response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "400":
          description: Missing username

  /earn:
    post:
      operationId: earnGems
      tags: [consumer]
      summary: Credit gems to a user (auto-creates user on first call)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EarnInput"
      responses:
        "200":
          description: Updated balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "400":
          description: Invalid input

  /spend:
    post:
      operationId: spendGems
      tags: [consumer]
      summary: Debit gems from a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendInput"
      responses:
        "200":
          description: Updated balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "400":
          description: Insufficient balance or invalid input

  /convert:
    post:
      operationId: convertGems
      tags: [consumer]
      summary: Convert gems into simulated $POOL tokens
      description: Converts whole multiples of the configured gem-to-$POOL rate after checking treasury backing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertInput"
      responses:
        "200":
          description: Conversion completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionResponse"
        "400":
          description: Invalid input, insufficient gems, or insufficient treasury backing

  /transfer:
    post:
      operationId: transferGems
      tags: [consumer]
      summary: Transfer gems between two users atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: Transfer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          description: Insufficient balance, same user, or invalid input

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users with wallet balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserWithWallet"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithWallet"
        "409":
          description: Username already taken

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User with wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithWallet"
        "404":
          description: User not found

  /wallets:
    get:
      operationId: listWallets
      tags: [wallets]
      summary: List all wallets with balances
      responses:
        "200":
          description: List of wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"

  /wallets/{userId}:
    get:
      operationId: getWallet
      tags: [wallets]
      summary: Get wallet for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Wallet not found

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with optional filters
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: appSource
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Credit or debit gems for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Insufficient balance or invalid input
        "404":
          description: User not found

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Summary stats for the ledger
      responses:
        "200":
          description: Ledger summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerSummary"

  /treasury:
    get:
      operationId: getTreasury
      tags: [treasury]
      summary: Get current treasury backing
      responses:
        "200":
          description: Current treasury state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Treasury"

  /treasury/adjust:
    post:
      operationId: adjustTreasury
      tags: [treasury]
      summary: Increase or decrease treasury backing
      description: Internal admin operation. Decreases are rejected if they would make backing negative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreasuryAdjustmentInput"
      responses:
        "200":
          description: Updated treasury state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Treasury"
        "400":
          description: Invalid adjustment or insufficient treasury backing

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List all API keys
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created API key (key value shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /api-keys/{key}:
    patch:
      operationId: updateApiKey
      tags: [api-keys]
      summary: Activate or deactivate an API key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
      responses:
        "200":
          description: Updated API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: API key not found
    delete:
      operationId: deleteApiKey
      tags: [api-keys]
      summary: Delete an API key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        createdAt:
          type: string

    UserWithWallet:
      type: object
      required: [id, username, createdAt, normalGems, rareGems, walletUpdatedAt]
      properties:
        id:
          type: string
        username:
          type: string
        createdAt:
          type: string
        gemBalance:
          type: integer
          description: Deprecated alias for normalGems.
        normalGems:
          type: integer
        rareGems:
          type: integer
        walletUpdatedAt:
          type: string

    UserInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1

    Wallet:
      type: object
      required: [userId, username, normalGems, rareGems, updatedAt]
      properties:
        userId:
          type: string
        username:
          type: string
        gemBalance:
          type: integer
          description: Deprecated alias for normalGems.
        normalGems:
          type: integer
        rareGems:
          type: integer
        updatedAt:
          type: string

    Transaction:
      type: object
      required: [id, userId, username, appSource, type, gemType, amount, balanceAfter, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        appSource:
          type: string
        type:
          type: string
          enum: [credit, debit, earn, spend, transfer_out, transfer_in, convert]
        gemType:
          $ref: "#/components/schemas/GemType"
        amount:
          type: integer
        balanceAfter:
          type: integer
        reason:
          type: ["string", "null"]
        createdAt:
          type: string

    TransactionInput:
      type: object
      required: [userId, appSource, type, amount]
      properties:
        userId:
          type: string
        appSource:
          type: string
        type:
          type: string
          enum: [credit, debit]
        gemType:
          $ref: "#/components/schemas/GemType"
        amount:
          type: integer
          minimum: 1
        reason:
          type: string

    BalanceResponse:
      type: object
      required: [username, userId, normalGems, rareGems]
      properties:
        username:
          type: string
        userId:
          type: string
        gemBalance:
          type: integer
          description: Deprecated alias for normalGems.
        normalGems:
          type: integer
        rareGems:
          type: integer

    EarnInput:
      type: object
      required: [username, amount]
      properties:
        username:
          type: string
        amount:
          type: integer
          minimum: 1
        gemType:
          $ref: "#/components/schemas/GemType"
          default: normal
        reason:
          type: string

    SpendInput:
      type: object
      required: [username, amount]
      properties:
        username:
          type: string
        amount:
          type: integer
          minimum: 1
        gemType:
          $ref: "#/components/schemas/GemType"
          default: normal
        reason:
          type: string

    TransferInput:
      type: object
      required: [fromUsername, toUsername, amount]
      properties:
        fromUsername:
          type: string
        toUsername:
          type: string
        amount:
          type: integer
          minimum: 1
        gemType:
          $ref: "#/components/schemas/GemType"
          default: normal
        reason:
          type: string

    TransferResponse:
      type: object
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/BalanceResponse"
        to:
          $ref: "#/components/schemas/BalanceResponse"

    LedgerSummary:
      type: object
      required: [totalUsers, totalGemsInCirculation, totalNormalGems, totalRareGems, totalTransactions, totalConversions, treasuryBacking, transactionsByApp]
      properties:
        totalUsers:
          type: integer
        totalGemsInCirculation:
          type: integer
        totalNormalGems:
          type: integer
        totalRareGems:
          type: integer
        totalTransactions:
          type: integer
        totalConversions:
          type: integer
        treasuryBacking:
          type: number
        transactionsByApp:
          type: array
          items:
            $ref: "#/components/schemas/AppStat"

    AppStat:
      type: object
      required: [appSource, transactionCount, totalCredited, totalDebited]
      properties:
        appSource:
          type: string
        transactionCount:
          type: integer
        totalCredited:
          type: integer
        totalDebited:
          type: integer

    GemType:
      type: string
      enum: [normal, rare]

    ConvertInput:
      type: object
      required: [username, gemType, amount, targetToken]
      properties:
        username:
          type: string
          minLength: 1
        gemType:
          $ref: "#/components/schemas/GemType"
        amount:
          type: integer
          minimum: 1
        targetToken:
          type: string
          enum: [POOL]

    ConversionResponse:
      type: object
      required: [username, userId, gemType, amount, targetToken, poolAmount, normalGems, rareGems, treasuryBacking, transactionId]
      properties:
        username:
          type: string
        userId:
          type: string
        gemType:
          $ref: "#/components/schemas/GemType"
        amount:
          type: integer
        targetToken:
          type: string
          enum: [POOL]
        poolAmount:
          type: number
        normalGems:
          type: integer
        rareGems:
          type: integer
        treasuryBacking:
          type: number
        transactionId:
          type: string

    Treasury:
      type: object
      required: [id, backingAmount, updatedAt]
      properties:
        id:
          type: string
        backingAmount:
          type: number
        updatedAt:
          type: string

    TreasuryAdjustmentInput:
      type: object
      required: [operation, amount]
      properties:
        operation:
          type: string
          enum: [increase, decrease]
        amount:
          type: number
          minimum: 0.01
        reason:
          type: string

    ApiKey:
      type: object
      required: [key, appName, active, createdAt]
      properties:
        key:
          type: string
        appName:
          type: string
        active:
          type: boolean
        createdAt:
          type: string

    ApiKeyInput:
      type: object
      required: [appName]
      properties:
        appName:
          type: string
          minLength: 1

    ApiKeyUpdate:
      type: object
      properties:
        active:
          type: boolean
